<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-CHKO - Jobs, Scholarships, Business</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 max-w-md mx-auto min-h-screen">

<div class="bg-black text-white p-4 sticky top-0 z-50">
<h1 class="font-black text-xl">A-CHKO</h1>
<p class="text-[11px] opacity-60">Jobs • Scholarships • Competition • Collab • Business • Mwanza</p>
</div>

<div class="flex gap-2 overflow-x-auto p-3 bg-white sticky top-[64px] z-40 border-b">
<button onclick="setType('all',this)" class="filter-btn bg-black text-white px-3 py-2 rounded-full text-xs font-bold">ALL</button>
<button onclick="setType('jobs',this)" class="filter-btn bg-gray-100 px-3 py-2 rounded-full text-xs font-bold">JOBS</button>
<button onclick="setType('scholarships',this)" class="filter-btn bg-gray-100 px-3 py-2 rounded-full text-xs font-bold">SCHOLARSHIPS</button>
<button onclick="setType('competition',this)" class="filter-btn bg-gray-100 px-3 py-2 rounded-full text-xs font-bold">COMPETITION</button>
<button onclick="setType('collaborations',this)" class="filter-btn bg-gray-100 px-3 py-2 rounded-full text-xs font-bold">COLLAB</button>
<button onclick="setType('business',this)" class="filter-btn bg-gray-100 px-3 py-2 rounded-full text-xs font-bold">BUSINESS</button>
</div>

<div id="list" class="p-3 space-y-3"></div>

<script>
// === WEKA KEYS ZAKO HAPA - BADILISHA HIZI MBILI TU ===
const SUPABASE_URL = "https://PUT-YOUR-URL.supabase.co";
const SUPABASE_KEY = "PUT-YOUR-ANON-KEY-HERE-eyJ...";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let activeType = 'all';

async function loadOpps() {
let q = supabaseClient.from('opportunities').select('*').order('is_sponsored',{ascending:false}).order('created_at',{ascending:false}).limit(50);
if(activeType !== 'all') q = q.eq('type', activeType);
const {data} = await q;
const list = document.getElementById('list');
if(!data || data.length===0){ list.innerHTML='<p class="text-center text-xs text-gray-400 p-10">Hakuna opportunities bado. Ongeza Supabase Table Editor.</p>'; return; }
list.innerHTML = '';
data.forEach(job => {
list.innerHTML += `
<div class="rounded-2xl p-4 border-2 ${job.is_sponsored?'border-yellow-400 bg-yellow-50':'bg-white border-gray-100'}">
${job.is_sponsored?`<span class="bg-yellow-400 text-[10px] px-2 py-1 rounded-full font-black">🔥 SPONSORED ${job.sponsor_name||''}</span>`:''}
<h3 class="font-bold text-[14px] mt-2">${job.title}</h3>
<p class="text-[11px] text-gray-500">${job.type.toUpperCase()} • ${job.location||'Global'} • ${job.clicks||0} views</p>
<div class="grid grid-cols-3 gap-2 mt-3">
<a href="${job.link}" target="_blank" onclick="addClick('${job.id}',${job.clicks||0})" class="bg-black text-white text-xs py-3 rounded-xl text-center font-bold">Apply</a>
<a href="https://wa.me/255762000000?text=Habari A-CHKO, nahitaji CV ya ${encodeURIComponent(job.title)}" class="bg-green-600 text-white text-xs py-3 rounded-xl text-center font-bold">CV 5k</a>
<a href="https://wa.me/?text=${encodeURIComponent(job.title+' '+job.link+' via A-CHKO')}" class="bg-gray-100 text-xs py-3 rounded-xl text-center font-bold">Share</a>
</div>
<button onclick="toggleChat('${job.id}')" class="w-full mt-3 text-xs text-blue-600 font-bold text-left">💬 Chat - Uliza kuhusu hii</button>
<div id="chat-${job.id}" class="hidden mt-2 bg-white rounded-xl border p-2">
<div id="msgs-${job.id}" class="h-32 overflow-y-auto text-xs space-y-1 p-1"></div>
<div class="flex gap-2 mt-2">
<input id="input-${job.id}" placeholder="Andika swali..." class="flex-1 border rounded-lg px-2 py-2 text-xs">
<button onclick="sendMsg('${job.id}')" class="bg-black text-white px-3 rounded-lg text-xs">Tuma</button>
</div>
</div>
</div>
`;
});
}

function setType(t,el) {
activeType=t;
document.querySelectorAll('.filter-btn').forEach(b=>b.className='filter-btn bg-gray-100 px-3 py-2 rounded-full text-xs font-bold');
el.className='filter-btn bg-black text-white px-3 py-2 rounded-full text-xs font-bold';
loadOpps();
}

async function toggleChat(id){
const box=document.getElementById('chat-'+id);
box.classList.toggle('hidden');
if(!box.classList.contains('hidden')){
const {data}=await supabaseClient.from('achko_chats').select('*').eq('opportunity_id',id).order('created_at');
document.getElementById('msgs-'+id).innerHTML=data.map(m=>`<div><b>${m.user_name}:</b> ${m.message}</div>`).join('') || '<span class="text-gray-400">Hakuna ujumbe, kuwa wa kwanza!</span>';
}
}

async function sendMsg(id){
const input=document.getElementById('input-'+id);
if(!input.value.trim()) return;
let name=localStorage.getItem('achko_name')||prompt('Jina lako?')||'Guest';
localStorage.setItem('achko_name',name);
await supabaseClient.from('achko_chats').insert({opportunity_id:id,user_name:name,message:input.value});
input.value='';
toggleChat(id); setTimeout(()=>toggleChat(id),300);
}

async function addClick(id,clicks){
await supabaseClient.from('opportunities').update({clicks:clicks+1}).eq('id',id);
}

loadOpps();
</script>
</body>
</html>
